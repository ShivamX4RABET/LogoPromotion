<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4RABET LOGO PROMOTION</title>
  <style>
    /* Global Styles */
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0f0f0f, #1c1c1c); /* Elegant dark gradient */
      font-family: 'Poppins', sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      text-align: center;
    }

    /* Header Logo */
    h1 {
      font-size: 4rem;
      font-weight: 700;
      text-transform: uppercase;
      margin: 0;
      color: white;
      letter-spacing: 3px;
    }

    h1 span {
      color: #007BFF; /* Blue for BET */
    }

    h1::after {
      content: '';
      display: block;
      margin: 10px auto;
      width: 60%;
      height: 3px;
      background: linear-gradient(90deg, #fff, #007BFF, #fff); /* Glowing underline */
      border-radius: 3px;
    }

    /* Subtitle */
    p {
      font-size: 1.4rem;
      margin: 20px 0 30px;
      color: #b3b3b3;
    }

    /* Button Styling */
    button {
      font-size: 1.2rem;
      color: #fff;
      background: linear-gradient(90deg, #007BFF, #0056b3); /* Sleek gradient button */
      border: none;
      border-radius: 30px;
      padding: 15px 40px;
      cursor: pointer;
      box-shadow: 0 6px 10px rgba(0, 123, 255, 0.5);
      transition: all 0.3s ease-in-out;
    }

    button:hover {
      background: linear-gradient(90deg, #0056b3, #003f7f);
      transform: scale(1.1);
      box-shadow: 0 8px 15px rgba(0, 123, 255, 0.8);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      h1 {
        font-size: 3rem;
      }
      p {
        font-size: 1.2rem;
      }
      button {
        font-size: 1rem;
        padding: 12px 30px;
      }
    }
  </style>
</head>
<body>
  <h1>4RA<span>BET</span> LOGO PROMOTION</h1>
  <p>Contact to Logo Promotion Provider</p>
  <button onclick="openWhatsApp()">CONTACT</button>

  <script>
    function openWhatsApp() {
      window.open('https://wa.link/w31q38', '_blank');
    }
  </script>
</body>
</html>
